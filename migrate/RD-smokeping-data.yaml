apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: restore-smokeping-data
  namespace: monitoring
spec:
  trigger:
    manual: restore-once
  kopia:
    repository: smokeping-volsync-secret
    cacheStorageClassName: ceph-block
    capacity: 1Gi
    copyMethod: Snapshot
    moverSecurityContext:
      fsGroup: 568
      runAsGroup: 568
      runAsUser: 568
    sourceIdentity:
      sourceName: migrate-smokeping-data
      sourceNamespace: monitoring
    destinationPVC: smokeping-data
    storageClassName: ceph-block
    accessModes:
      - ReadWriteOnce
    # Cleanup
    cleanupCachePVC: true
    cleanupTempPVC: true
    volumeSnapshotClassName: ceph-block
