apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: restore-wishlist
  namespace: default
spec:
  trigger:
    manual: restore-once
  kopia:
    repository: wishlist-volsync-secret
    cacheStorageClassName: ceph-block
    cacheCapacity: 10Gi
    copyMethod: Snapshot
    moverSecurityContext:
      fsGroup: 568
      runAsGroup: 568
      runAsUser: 568
    sourceIdentity:
      sourceName: migrate-wishlist
      sourceNamespace: default
    destinationPVC: wishlist
    storageClassName: ceph-block
    accessModes:
      - ReadWriteOnce
    # Cleanup
    cleanupCachePVC: true
    cleanupTempPVC: true
    volumeSnapshotClassName: ceph-block
