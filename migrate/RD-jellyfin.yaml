apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: restore-jellyfin
  namespace: media
spec:
  trigger:
    manual: restore-once
  kopia:
    repository: jellyfin-volsync-secret
    cacheStorageClassName: ceph-block
    cacheCapacity: 5Gi
    copyMethod: Snapshot
    moverSecurityContext:
      fsGroup: 568
      runAsGroup: 568
      runAsUser: 568
    sourceIdentity:
      sourceName: migrate-jellyfin
      sourceNamespace: media
    destinationPVC: jellyfin
    storageClassName: ceph-block
    accessModes:
      - ReadWriteOnce
    # Cleanup
    cleanupCachePVC: true
    cleanupTempPVC: true
    volumeSnapshotClassName: ceph-block
