---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: forgejo-secret
    template:
      data:
        DB_PASSWORD: '{{ .DBPASS }}'
        RUNNER_TOKEN: '{{ .RUNNER_TOKEN }}'
  dataFrom:
    - extract:
        key: forgejo
