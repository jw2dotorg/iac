---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev

resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./externalsecret.yaml

configMapGenerator:
  - name: forgejo-custom-theme
    files:
      - theme-gitlabish-light.css
generatorOptions:
  disableNameSuffixHash: true
