---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app gramps
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: gramps-secret
    template:
      data:
        GRAMPSWEB_SECRET_KEY: "{{ .SECRET_KEY }}"
        # Shared postgres cluster
        GRAMPSWEB_POSTGRES_HOST: &dbHost postgres18-rw.database.svc.cluster.local
        GRAMPSWEB_POSTGRES_PORT: "5432"
        GRAMPSWEB_POSTGRES_USER: &dbUser "{{ .DBUSER }}"
        GRAMPSWEB_POSTGRES_PASSWORD: &dbPass "{{ .DBPASS }}"
        GRAMPSWEB_SEARCH_INDEX_DB_URI: "postgresql://{{ .DBUSER }}:{{ .DBPASS }}@postgres18-rw.database.svc.cluster.local:5432/gramps"
        GRAMPSWEB_USER_DB_URI: "postgresql://{{ .DBUSER }}:{{ .DBPASS }}@postgres18-rw.database.svc.cluster.local:5432/gramps"
        # Authentik OIDC
        GRAMPSWEB_OIDC_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        GRAMPSWEB_OIDC_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: &dbName gramps
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .postgres_pw }}"
  dataFrom:
    - extract:
        key: *app
    - extract:
        key: postgres-superuser
