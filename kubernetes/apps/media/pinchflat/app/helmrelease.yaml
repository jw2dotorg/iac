---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pinchflat
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      pinchflat:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &img
              repository: ghcr.io/kieraneglin/pinchflat
              tag: v2025.6.6
            env:
              LOG_LEVEL: info
              PORT: &port 80
              TZ: ${TZ}
              TZ_DATA_DIR: /tmp/elixir_tz_data
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
        initContainers:
          01-support-ytdlp-updates:
            image: *img
            command:
              - "/bin/sh"
              - "-c"
              - |
                cp -r /usr/local/bin/* /local/
            securityContext: *sc
            resources:
              requests:
                cpu: 5m
                memory: 10M
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_OG_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: *app
      media:
        type: nfs
        server: prox.${SECRET_OG_DOMAIN}
        path: /spinnerpool/media
        advancedMounts:
          pinchflat:
            app:
              - path: /downloads
                subPath: media/youtube
      tmp:
        type: emptyDir
        advancedMounts:
          pinchflat:
            app:
              - subPath: tmp
                path: /tmp
              - subPath: yt-dlp
                path: /etc/yt-dlp
              - subPath: local
                path: /usr/local/bin
            01-support-ytdlp-updates:
              - subPath: local
                path: /local
