---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app authentik
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: *app
    template:
      engineVersion: v2
      data:
        AUTHENTIK_SECRET_KEY: '{{ .AUTHENTIK_SECRET_KEY }}'
        AUTHENTIK_POSTGRESQL__HOST: &dbHost "postgres18-rw.database.svc.cluster.local"
        AUTHENTIK_POSTGRESQL__USER: '{{ .DBUSER }}'
        AUTHENTIK_POSTGRESQL__PASSWORD: '{{ .DBPASS }}'
        AUTHENTIK_POSTGRESQL__NAME: &dbName authentik
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: '{{ .DBUSER }}'
        INIT_POSTGRES_PASS: '{{ .DBPASS }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .postgres_pw }}'
  dataFrom:
  - extract:
      key: *app
  - extract:
      key: postgres-superuser
