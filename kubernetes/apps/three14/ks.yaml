---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app three14
spec:
  interval: 1h
  path: ./kubernetes/apps/three14/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: three14
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  retryInterval: 1m
  timeout: 5m
