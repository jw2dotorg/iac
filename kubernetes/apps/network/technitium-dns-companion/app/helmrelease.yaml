---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app technitium-dns-companion
spec:
  chartRef:
    kind: OCIRepository
    name: technitium-dns-companion
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      technitium-dns-companion:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/fail-safe/technitium-dns-companion
              tag: 1.10.1
            env:
              PUID: 1000
              PGID: 1000
              TRUST_PROXY: true
              TECHNITIUM_NODES: "primary,secondary"
            envFrom:
              - secretRef:
                  name: *app
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 3000

    route:
      app:
        hostnames:
          - "dnsapp.${SECRET_OG_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
