---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-ddns
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-ddns
  interval: 1h
  values:
    controllers:
      cloudflare-ddns:
        containers:
          app:
            image:
              repository: favonia/cloudflare-ddns
              tag: 1.16.2
            env:
              CLOUDFLARE_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cloudflare-dns-secret
                    key: api-token
              DOMAINS: "${SECRET_DOMAIN},${SECRET_OG_DOMAIN},mg.${SECRET_OG_DOMAIN},mail.${SECRET_OG_DOMAIN}"
              PROXIED: "true"
              IP6_PROVIDER: "none"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
