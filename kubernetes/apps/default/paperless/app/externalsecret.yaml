---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: paperless-secret
    template:
      data:
        PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
        PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
              "APPS": [
                {
                  "provider_id": "authentik",
                  "name": "Authentik",
                  "client_id": "{{ .PAPERLESS_OAUTH_CLIENT_ID }}",
                  "secret": "{{ .PAPERLESS_OAUTH_CLIENT_SECRET }}",
                  "settings": {
                    "server_url": "https://sso.${SECRET_OG_DOMAIN}/application/o/paperless/.well-known/openid-configuration"
                  }
                }
              ]
            }
          }
        PAPERLESS_DBHOST: &dbHost postgres18-rw.database.svc.cluster.local
        PAPERLESS_DBNAME: &dbName paperless
        PAPERLESS_DBUSER: '{{ .DBUSER }}'
        PAPERLESS_DBPASS: '{{ .DBPASS }}'
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: '{{ .DBUSER }}'
        INIT_POSTGRES_PASS: '{{ .DBPASS }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .postgres_pw }}'
  dataFrom:
    - extract:
        key: paperless
    - extract:
        key: postgres-superuser
