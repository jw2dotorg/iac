---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-bridge
  namespace: flux-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy-bridge
  template:
    metadata:
      labels:
        app: ntfy-bridge
    spec:
      containers:
        - name: bridge
          image: python:3.14-slim
          command: ["python", "/app/app.py"]
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 5m
              memory: 12Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: ntfy-bridge-code
