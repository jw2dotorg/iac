apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app frigate
  namespace: home
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn:
    - name: mosquitto
  values:
    controllers:
      frigate:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          nodeSelector:
            kubernetes.io/hostname: talos1  # passthrough GPU
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.16.3
            env:
              TZ: ${TIMEZONE}
              LIBVA_DRIVER_NAME: iHD
            envFrom:
              - secretRef:
                  name: frigate
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: &port 5000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 100m
                #memory: 4Gi
                memory: 1Gi
              limits:
                memory: 7Gi

    service:
      app:
        controller: *app
        primary: true
        ports:
          http:
            port: *port
          rtsp:
            port: &restream-port 8554
      external-rtsp:
        enabled: true
        controller: *app
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: 172.16.0.97
        ports:
          rtsp-tcp:
            enabled: true
            port: *restream-port
            protocol: TCP
            targetPort: *restream-port

    route:
      app:
        enabled: true
        hostnames:
          - frigate.${SECRET_OG_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: frigate-app
                port: *port

    securityContext:
      privileged: true

    persistence:
      config:
        existingClaim: frigate
        globalMounts:
          - path: /data
      config-file:
        type: configMap
        name: frigate-config
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
      media:
        type: nfs
        server: 172.16.0.11
        path: /saspool1/frigate
        globalMounts:
          - path: /media/frigate
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        globalMounts:
          - path: /dev/shm
      #usb:
      #  type: hostPath
      #  hostPath: /dev/bus/usb
      #  hostPathType: Directory
      #  globalMounts:
      #    - path: /dev/bus/usb
