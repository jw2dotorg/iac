---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app grafana-admin
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: *app
    template:
      engineVersion: v2
      data:
        admin-user: "{{ .ADMIN_USERNAME }}"
        admin-password: "{{ .ADMIN_PASSWORD }}"
  dataFrom:
  - extract:
      key: *app
