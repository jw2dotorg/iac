---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./dashboard
  - ./ocirepository.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: snmp-exporter-brocade
    files:
      - snmp.yaml=./snmp.yml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
