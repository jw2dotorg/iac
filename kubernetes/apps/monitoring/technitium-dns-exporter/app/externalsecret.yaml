---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app technitium-dns-exporter
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: *app
    template:
      engineVersion: v2
      data:
        TECHNITIUM_BASE_URL: "{{ .BASE_URL }}"
        TECHNITIUM_TOKEN: "{{ .EXPORTER_TOKEN }}"
  dataFrom:
  - extract:
      key: *app
