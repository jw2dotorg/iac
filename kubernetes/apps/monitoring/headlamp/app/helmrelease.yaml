---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 15m
  chart:
    spec:
      chart: headlamp
      version: "0.44.0" # renovate: datasource=helm depName=headlamp registryUrl=https://kubernetes-sigs.github.io/headlamp/
      sourceRef:
        kind: HelmRepository
        name: headlamp
  values:
    replicaCount: 1
    config:
      watchPlugins: true
      unsafeUseServiceAccountToken: true

    ingress:
      enabled: false

    clusterRoleBinding:
      create: true
    serviceAccount:
      create: true

    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.6.0
